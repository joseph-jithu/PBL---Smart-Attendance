<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
        }

        header {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            font-size: 26px;
            color: #00f2ff;
            box-shadow: 0 0 15px #00f2ff;
            position: relative;
        }

        header a {
            position: absolute;
            right: 20px;
            top: 20px;
            color: #ff4d4d;
            text-decoration: none;
            font-size: 16px;
        }

        header a:hover {
            text-decoration: underline;
        }

        .container {
            padding: 30px;
            text-align: center;
        }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            padding: 25px;
            margin: 25px auto;
            border-radius: 15px;
            width: 65%;
            box-shadow: 0 0 20px rgba(0,242,255,0.3);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0,242,255,0.7);
        }

        h2 {
            color: #00f2ff;
            margin-bottom: 15px;
        }

        input {
            padding: 12px;
            width: 250px;
            border-radius: 8px;
            border: none;
            margin-right: 10px;
            outline: none;
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(45deg, #00f2ff, #00c3cc);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: black;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00f2ff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            overflow: hidden;
            border-radius: 10px;
        }

        th {
            background: linear-gradient(45deg, #00f2ff, #00c3cc);
            color: black;
            padding: 12px;
        }

        td {
            padding: 12px;
            background: rgba(255,255,255,0.05);
        }

        tr:hover td {
            background: rgba(0,242,255,0.2);
            transition: 0.2s;
        }

        /* 🔥 Loading animation */
        @keyframes glow {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        #loadingMsg {
            display: none;
            color: #00f2ff;
            margin-top: 15px;
            font-size: 18px;
            animation: glow 1s infinite alternate;
        }

    </style>
</head>

<body>

<header>
    🚀 Smart Attendance Dashboard
    <a href="/logout">Logout</a>
</header>

<div class="container">

    <div class="card">
        <h2>📸 Start Attendance</h2>

        <form action="/start" method="POST" onsubmit="showLoading()">
            <input type="text" name="subject" placeholder="Enter Subject" required>
            <button id="startBtn" type="submit">Start</button>
        </form>

        <!-- 🔥 Loading Message -->
        <p id="loadingMsg">⏳ Please wait, camera is opening...</p>
    </div>

    <div class="card">
        <h2>📊 Attendance Records</h2>

        <table>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Subject</th>
                <th>Timestamp</th>
            </tr>

            {% for row in records %}
            <tr>
                <td>{{row[0]}}</td>
                <td>{{row[1]}}</td>
                <td>{{row[2]}}</td>
                <td>{{row[3]}}</td>
            </tr>
            {% endfor %}
        </table>

    </div>

</div>

<!-- 🔧 Script -->
<script>
function showLoading() {
    document.getElementById("loadingMsg").style.display = "block";
    document.getElementById("startBtn").innerText = "Starting...";
    document.getElementById("startBtn").disabled = true;
}
</script>

</body>
</html>
